apiVersion: apps/v1
kind: Deployment
metadata:
  name: base-evmm-autoscaler
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: base-evmm
  template:
    metadata:
      labels:
        app: base-evmm
    spec:
      serviceAccountName: evmm-autoscaler-sa
      containers:
      - name: autoscaler
        image: python:3.9-slim
        command: ["/bin/sh", "-c"]
        args:
          - |
            # Use extra timeout and no-cache to avoid previous failures
            pip install --default-timeout=1000 --no-cache-dir kubernetes prometheus-api-client pandas numpy scikit-learn pytz
            python /app/base_evmm.py
        volumeMounts:
        - name: code
          mountPath: /app/base_evmm.py
          subPath: base_evmm.py
      volumes:
      - name: code
        configMap:
          name: base-evmm-code
